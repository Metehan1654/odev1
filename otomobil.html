<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otomobil Galerisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .galeri-resim {
            height: 150px !important;
            width: 100%;
            object-fit: cover;
            object-position: center center;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .galeri-resim:hover { opacity: 0.8; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex gap-4 justify-center flex-wrap">
            <a href="index.html" class="hover:text-gray-300 font-bold">Ana Sayfa</a>
            <a href="hayvan.html" class="hover:text-gray-300">Hayvan</a>
            <a href="cicek.html" class="hover:text-gray-300">Çiçek</a>
            <a href="spor.html" class="hover:text-gray-300">Spor</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 text-center">
        <h2 class="text-3xl font-bold mb-6 text-gray-800">Otomobil Galerisi</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <a href="Ranger.jpg" target="_blank"><img src="Ranger.jpg" title="Ford Ranger" class="galeri-resim" alt="Ford Ranger"></a>
            <a href="Bugatti.jpg" target="_blank"><img src="Bugatti.jpg" title="Bugatti Chiron" class="galeri-resim" alt="Bugatti Chiron"></a>
            <a href="Mini.jpg" target="_blank"><img src="Mini.jpg" title="Mini Cooper" class="galeri-resim" alt="Mini Cooper"></a>
            <a href="Challenger.jpg" target="_blank"><img src="Challenger.jpg" title="Dodge Challenger" class="galeri-resim" alt="Dodge Challenger"></a>
        </div>
    </div>

</body>
</html>
