<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spor Galerisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .galeri-resim {
            height: 150px !important;
            width: 100%;
            object-fit: cover;
            object-position: center center;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .galeri-resim:hover { opacity: 0.8; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex gap-4 justify-center flex-wrap">
            <a href="index.html" class="hover:text-gray-300 font-bold">Ana Sayfa</a>
            <a href="otomobil.html" class="hover:text-gray-300">Otomobil</a>
            <a href="hayvan.html" class="hover:text-gray-300">Hayvan</a>
            <a href="cicek.html" class="hover:text-gray-300">Çiçek</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 text-center">
        <h2 class="text-3xl font-bold mb-6 text-gray-800">Spor Galerisi</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <a href="basketbol.jpg" target="_blank"><img src="basketbol.jpg" title="Basketbol" class="galeri-resim" alt="Basketbol"></a>
            <a href="yuzme.jpg" target="_blank"><img src="yuzme.jpg" title="Yüzme Havuzu" class="galeri-resim" alt="Yüzme"></a>
            <a href="voleybol.jpg" target="_blank"><img src="voleybol.jpg" title="Voleybol Maçı" class="galeri-resim" alt="Voleybol"></a>
            <a href="Metehan.jpg" target="_blank"><img src="Metehan.jpg" title="Kaleci Kurtarışı" class="galeri-resim" alt="Metehan Kaleci"></a>
        </div>
    </div>

</body>
</html>
